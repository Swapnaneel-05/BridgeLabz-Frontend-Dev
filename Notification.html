<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications Dashboard</title>

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5">

    <!-- DASHBOARD CARD -->
    <div class="card shadow-sm">
      <div class="card-body">

        <h2 class="fw-bold mb-4 text-center">User Notifications</h2>

        <!-- SUCCESS ALERT -->
        <div class="alert alert-success" role="alert">
          You have 2 new messages!
        </div>

        <!-- INFO ALERT -->
        <div class="alert alert-info" role="alert">
           Tip: Update your profile to get better recommendations.
        </div>

        <!-- DANGER ALERT -->
        <div class="alert alert-danger" role="alert">
          Your password will expire in 3 days.
        </div>

        <!-- DISMISSIBLE ALERT -->
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          Scheduled maintenance tonight at 12 AM.
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- SUMMARY WELL -->
        <div class="bg-light border rounded p-4 mt-4">
          <h5 class="fw-bold mb-2">Summary</h5>
          <p class="mb-0 text-secondary">
            You have 3 important notifications pending. Stay updated and secure your account.
          </p>
        </div>

      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
