<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model</title>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f5f5;font-family:sans-serif;}
.wrapper{background:#ddd;padding:20px;border:5px solid #999;margin:20px;outline:2px dashed red;max-width:300px;text-align:center;}
.borderbox{box-sizing:border-box;width:200px;padding:20px;border:10px solid steelblue;margin:10px;background:#fff;}
</style>
</head>
<body>
<div class="wrapper">
<h3>Box Model</h3>
<div class="borderbox">Content Area</div>
<p>Shows padding, border, and margin visually.</p>
</div>
</body>
</html>
