<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Height & Width</title>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;gap:20px;background:#f0f0f0;}
.box{display:flex;justify-content:center;align-items:center;color:#fff;}
.box1{width:200px;height:100px;background:teal;}
.box2{width:30%;min-height:150px;background:tomato;}
.box3{width:10em;height:30vh;max-width:250px;background:slateblue;overflow:auto;}
</style>
</head>
<body>
<div class="box box1">px</div>
<div class="box box2">%</div>
<div class="box box3">vh/em</div>
</body>
</html>
