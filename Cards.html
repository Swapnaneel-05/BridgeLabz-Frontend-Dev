<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Cards with Media Queries</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .card-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      width: 22%;
      min-width: 200px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .card:hover {
      background: #e3f2fd;
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #0b3c5d;
    }

    .card p {
      color: #555;
      line-height: 1.4;
    }

    /* Tablet — 2 columns */
    @media (max-width: 900px) {
      .card {
        width: 45%;
      }
    }

    /* Mobile — 1 column */
    @media (max-width: 600px) {
      .card {
        width: 90%;
      }
    }

  </style>
</head>

<body>

  <h1>Responsive Cards Layout</h1>

  <div class="card-container">

    <div class="card">
      <h3>Card One</h3>
      <p>This is a responsive card. It changes layout with media queries.</p>
    </div>

    <div class="card">
      <h3>Card Two</h3>
      <p>The layout switches to two columns on tablets.</p>
    </div>

    <div class="card">
      <h3>Card Three</h3>
      <p>On mobile screens, all cards stack vertically.</p>
    </div>

    <div class="card">
      <h3>Card Four</h3>
      <p>Each card changes background color when hovered.</p>
    </div>

  </div>

</body>
</html>
