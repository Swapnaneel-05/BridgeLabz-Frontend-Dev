<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Pagination</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5">

    <h1 class="text-center mb-4 fw-bold">Blog Posts</h1>

    <!-- Sample Posts Title Section -->
    <div class="text-center mb-5">
      <p class="text-secondary">Showing page content for demonstration.</p>
    </div>

    <!-- PAGINATION -->
    <nav>
      <ul class="pagination justify-content-center mb-4">
        <li class="page-item">
          <a class="page-link" href="#">Previous</a>
        </li>

        <li class="page-item">
          <a class="page-link" href="#">1</a>
        </li>

        <li class="page-item">
          <a class="page-link" href="#">2</a>
        </li>

        <li class="page-item">
          <a class="page-link" href="#">Next</a>
        </li>
      </ul>
    </nav>

    <!-- SIMPLE PAGER -->
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="#" class="btn btn-outline-secondary">← Older Posts</a>
      <a href="#" class="btn btn-outline-secondary">Newer Posts →</a>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
