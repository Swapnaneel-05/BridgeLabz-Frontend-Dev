<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demonstration</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f4f8;
      font-family: Poppins, sans-serif;
    }

    .container {
      display: flex;
      gap: 40px;
    }

    /* Moving Box */
    .move-box {
      width: 60px;
      height: 60px;
      background: #007bff;
      animation: move 3s ease-in-out infinite alternate;
    }

    @keyframes move {
      from { transform: translateX(0); }
      to { transform: translateX(80px); }
    }

    /* Bouncing Ball */
    .ball {
      width: 50px;
      height: 50px;
      background: crimson;
      border-radius: 50%;
      animation: bounce 1.5s ease-in-out infinite;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(-60px); }
      100% { transform: translateY(0); }
    }

    /* Color Changing Text */
    .text {
      font-size: 24px;
      font-weight: bold;
      animation: colorChange 2s ease-in-out infinite alternate;
      animation-delay: 0.5s;
    }

    @keyframes colorChange {
      from { color: black; }
      to { color: #ff5722; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="move-box"></div>
    <div class="ball"></div>
    <div class="text">Animating Text</div>
  </div>
</body>
</html>
