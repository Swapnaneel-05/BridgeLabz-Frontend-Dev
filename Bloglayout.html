<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  font-family: sans-serif;
  padding: 20px;
}

.blog-container {
  display: grid;
  grid-template-areas:
    "header header"
    "nav nav"
    "aside main"
    "footer footer";
  grid-template-columns: 1fr 2fr;
  gap: 20px;
}

header {
  grid-area: header;
  background: #333;
  color: white;
  text-align: center;
  padding: 10px;
}

nav {
  grid-area: nav;
  display: flex;
  justify-content: center;
  gap: 15px;
  background: #555;
  padding: 10px;
}

nav a {
  color: white;
  text-decoration: none;
}

aside {
  grid-area: aside;
  background: #f0f0f0;
  padding: 20px;
}

main {
  grid-area: main;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

article {
  background: #e8e8e8;
  padding: 20px;
  border-radius: 5px;
}

footer {
  grid-area: footer;
  background: #333;
  color: white;
  text-align: center;
  padding: 10px;
}
    </style>
</head>
<body>
    <div class="blog-container">
    <header>My Blog</header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <aside>
      <h3>Categories</h3>
      <ul>
        <li>Technology</li>
        <li>Design</li>
        <li>Development</li>
      </ul>
    </aside>
    <main>
      <article>
        <h2>Blog Post 1</h2>
        <p>Short intro about blog post one.</p>
      </article>
      <article>
        <h2>Blog Post 2</h2>
        <p>Short intro about blog post two.</p>
      </article>
    </main>
    <footer>Contact: info@example.com</footer>
  </div>
</body>
</html>
