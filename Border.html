<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders & Padding</title>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;gap:20px;font-family:sans-serif;}
.box{padding:20px 40px;border:4px solid black;transition:0.3s;}
.box:hover{border-color:tomato;}
.solid{border-style:solid;}
.dashed{border-style:dashed;}
.double{border-style:double;}
.groove{border-style:groove;border-radius:10px;}
</style>
</head>
<body>
<div class="box solid">Solid</div>
<div class="box dashed">Dashed</div>
<div class="box double">Double</div>
<div class="box groove">Groove</div>
</body>
</html>
