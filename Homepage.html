<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  font-family: sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
header {
  background: #333;
  color: white;
  padding: 15px 0;
}

nav {
  display: flex;
  justify-content: space-around;
}

nav a {
  color: white;
  text-decoration: none;
}

/* Main */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 20px;
  flex-wrap: wrap;
}

.box {
  background: #f4f4f4;
  padding: 40px;
  text-align: center;
  border-radius: 8px;
  width: 200px;
  transition: transform 0.3s;
}

.box:hover {
  transform: rotate(2deg);
}

/* Footer */
footer {
  background: #333;
  color: white;
  text-align: center;
  padding: 10px;
  margin-top: auto;
}
    </style>
</head>
<body>
    <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  
  <main>
    <div class="box">Services</div>
    <div class="box">Projects</div>
    <div class="box">Contact</div>
  </main>

  <footer>
    <p>&copy; 2025 Swapnaneel</p>
  </footer>
</body>
</html>
