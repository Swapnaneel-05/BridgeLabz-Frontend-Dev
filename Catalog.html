<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog - Bootstrap Grid</title>

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    .product-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15) !important;
    }

    .product-img {
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>

<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center fw-bold mb-4">Product Catalog</h1>

    <div class="row g-4">

      <!-- PRODUCT 1 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm product-card">
          <img src="https://picsum.photos/300/200?1" class="card-img-top product-img" alt="">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="text-primary fw-bold">$49.99</p>
            <button class="btn btn-success btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>
