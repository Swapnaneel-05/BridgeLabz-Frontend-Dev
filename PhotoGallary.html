<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
  font-family: sans-serif;
  padding: 20px;
  background: #f4f4f4;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

figure {
  overflow: hidden;
  border-radius: 8px;
  background: white;
  text-align: center;
}

img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: transform 0.5s ease;
}

img:hover {
  transform: scale(1.1);
}
  </style>
</head>
<body>
  <div class="gallery">
    <figure>
      <img src="img.com" alt="Image 1">
      <figcaption>Image 1</figcaption>
    </figure>
    <figure>
      <img src="img.com" alt="Image 2">
      <figcaption>Image 2</figcaption>
    </figure>
    <figure>
      <img src="img.com" alt="Image 3">
      <figcaption>Image 3</figcaption>
    </figure>
    <figure>
      <img src="img.com" alt="Image 4">
      <figcaption>Image 4</figcaption>
    </figure>
  </div>
</body>
</html>
