<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Plans - Bootstrap</title>

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    .pricing-card {
      transition: 0.3s ease;
    }

    .pricing-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18) !important;
    }
  </style>
</head>

<body class="bg-light">

  <div class="container py-5">

    <h1 class="text-center fw-bold mb-5">Choose Your Plan</h1>

    <div class="row g-4">

      <!-- BASIC PLAN -->
      <div class="col-md-4">
        <div class="card shadow-sm pricing-card">
          <div class="card-body text-center">
            <h3 class="fw-bold">Basic</h3>
            <p class="display-6">$9<span class="fs-6">/mo</span></p>

            <ul class="list-unstyled mt-3 mb-4">
              <li>✔ 5 Projects</li>
              <li>✔ Basic Support</li>
              <li>✔ Community Access</li>
            </ul>

            <button class="btn btn-outline-primary">Select Plan</button>
          </div>
        </div>
      </div>

      <!-- PRO PLAN (HIGHLIGHTED) -->
      <div class="col-md-4">
        <div class="card text-white bg-primary shadow-sm pricing-card">
          <div class="card-body text-center">
            <h3 class="fw-bold">Pro</h3>
            <p class="display-6 text-white">$19<span class="fs-6">/mo</span></p>

            <ul class="list-unstyled mt-3 mb-4">
              <li>✔ Unlimited Projects</li>
              <li>✔ Priority Support</li>
              <li>✔ Team Collaboration</li>
            </ul>

            <button class="btn btn-light text-primary fw-bold">Choose Pro</button>
          </div>
        </div>
      </div>

      <!-- PREMIUM PLAN -->
      <div class="col-md-4">
        <div class="card shadow-sm pricing-card">
          <div class="card-body text-center">
            <h3 class="fw-bold">Premium</h3>
            <p class="display-6">$49<span class="fs-6">/mo</span></p>

            <ul class="list-unstyled mt-3 mb-4">
              <li>✔ Everything in Pro</li>
              <li>✔ Dedicated Manager</li>
              <li>✔ Custom Integrations</li>
            </ul>

            <button class="btn btn-outline-primary">Select Plan</button>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script 
   src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
