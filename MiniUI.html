<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f0f4f8;
      font-family: Poppins, sans-serif;
    }

    header, footer {
      background: #007bff;
      padding: 15px;
      color: white;
      text-align: center;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .card {
      background: white;
      width: 350px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
      transition: 0.3s;
    }

    input:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px #007bff;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

<header>
  <h1>Mini UI Layout</h1>
</header>

<main>
  <div class="card">
    <img src="https://picsum.photos/400/200" alt="Sample">

    <input type="text" placeholder="Enter name">
    <button>Submit</button>
  </div>
</main>

<footer>
  <p>Footer Content © 2025</p>
</footer>

</body>
</html>
