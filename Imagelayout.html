<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 90%;
      max-width: 1000px;
    }

    figure {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      margin: 0;
      background: #fff;
      transition: transform 0.3s ease;
    }

    figure:hover {
      transform: scale(1.02);
    }

    figure img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }

    /* Overlay effect */
    figure::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      transition: background 0.3s ease;
      border-radius: 12px;
    }

    figure:hover::after {
      background: rgba(0, 0, 0, 0.4);
    }

    figure:hover img {
      transform: scale(1.1);
    }

    figcaption {
      text-align: center;
      padding: 12px;
      font-size: 16px;
      font-weight: 500;
      color: #333;
      background-color: #fff;
      border-radius: 0 0 12px 12px;
    }

    /* Responsive layout for smaller screens */
    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: 1fr;
      }
      figure img {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/400/300?random=1" alt="Mountain View">
      <figcaption>Peaceful Mountain View</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?random=2" alt="Ocean Waves">
      <figcaption>Soothing Ocean Waves</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?random=3" alt="Forest Path">
      <figcaption>Misty Forest Path</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?random=4" alt="City Lights">
      <figcaption>City Lights at Night</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?random=5" alt="Desert Dunes">
      <figcaption>Golden Desert Dunes</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?random=6" alt="Snowy Peaks">
      <figcaption>Snowy Mountain Peaks</figcaption>
    </figure>
  </div>

</body>
</html>
