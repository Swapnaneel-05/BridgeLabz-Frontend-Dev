<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker with Badges</title>

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    .task-card {
      max-width: 700px;
      margin: auto;
    }
  </style>
</head>

<body class="bg-light">

  <div class="container py-5">

    <!-- HEADER -->
    <div class="task-card card shadow-sm mb-4">
      <div class="card-body text-center">
        <h2 class="fw-bold">
          Task Tracker
          <span class="badge bg-primary ms-2">5 Pending</span>
        </h2>
      </div>
    </div>

    <!-- TASK LIST -->
    <div class="task-card card shadow-sm">
      <div class="card-body">

        <ul class="list-group">

          <li class="list-group-item d-flex justify-content-between align-items-center">
            Finish UI Design
            <span class="badge bg-danger">High</span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            Prepare Presentation
            <span class="badge bg-warning text-dark">Medium</span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            Update Portfolio
            <span class="badge bg-success">Low</span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            Fix Navbar Bug
            <span class="badge bg-danger">High</span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            Email Clients
            <span class="badge bg-warning text-dark">Medium</span>
          </li>

        </ul>

        <!-- COMPLETED BUTTON -->
        <div class="text-center mt-4">
          <button class="btn btn-success">
            Completed <span class="badge bg-light text-success ms-1">2</span>
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script 
   src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
