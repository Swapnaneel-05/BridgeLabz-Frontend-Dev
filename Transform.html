<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformations</title>
<style>
body{display:flex;justify-content:center;align-items:center;gap:20px;min-height:100vh;font-family:sans-serif;}
.box{width:100px;height:100px;background:lightcoral;display:flex;align-items:center;justify-content:center;transition:all 0.4s ease;color:#fff;font-weight:bold;flex-direction:column;}
.rotate:hover{transform:rotate(20deg);}
.scale:hover{transform:scale(1.3);}
.translate:hover{transform:translateY(-20px);}
.skew:hover{transform:skew(15deg);}
</style>
</head>
<body>
<div class="box rotate">Rotate</div>
<div class="box scale">Scale</div>
<div class="box translate">Translate</div>
<div class="box skew">Skew</div>
</body>
</html>
