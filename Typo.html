<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Typography Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f9fc;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .content {
      max-width: 800px;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 3rem);
      color: #0b3c5d;
      margin-bottom: 20px;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      line-height: 1.6;
      color: #444;
      margin-bottom: 20px;
    }

    /* Below 700px — improve readability */
    @media (max-width: 700px) {
      p {
        line-height: 1.9;
        letter-spacing: 0.5px;
      }

      .content {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Responsive Typography with clamp()</h1>
    <p>
      This text demonstrates how responsive typography changes smoothly using
      <strong>relative units</strong> and the <strong>clamp()</strong> function. Resize the browser window to see how
      the heading and paragraph adapt automatically.
    </p>
  </div>

</body>
</html>
