<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography</title>
<style>
body{font-family:Arial,serif;line-height:1.6;letter-spacing:0.5px;padding:40px;}
article{max-width:600px;margin:auto;text-align:justify;}
mark{background:yellow;color:black;}
strong{color:darkred;}
em{color:blue;}
p::first-letter{font-size:2em;color:tomato;}
p::first-line{font-weight:bold;}
</style>
</head>
<body>
<article>
<h1>Typography Example</h1>
<p><mark>Typography</mark> is the art of arranging text. <strong>Good typography</strong> improves readability and design. <em>CSS</em> provides properties for control over spacing and size.</p>
</article>
</body>
</html>
