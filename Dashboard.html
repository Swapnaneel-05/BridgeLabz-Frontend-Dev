<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  font-family: sans-serif;
  height: 100vh;
}

.container {
  display: grid;
  grid-template-columns: 1fr 3fr;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

header {
  grid-column: span 2;
  background: darkkhaki;
  color: white;
  text-align: center;
  padding: 15px;
}

aside {
  background: #f0f0f0;
  padding: 20px;
}

aside nav {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

aside a {
  text-decoration: none;
  color: #333;
}

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-gap: 20px;
  padding: 20px;
  background: #fff;
}

.box {
  background: #e4e4e4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 150px;
  border-radius: 8px;
  transition: 0.3s;
}

.box:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.box1 {
  grid-column: span 2;
}
    </style>
</head>
<body>
    <div class="container">
    <header>Dashboard Header</header>
    <aside>
      <nav>
        <a href="#">Home</a>
        <a href="#">Analytics</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>
    <main>
      <div class="box box1">Box 1</div>
      <div class="box box2">Box 2</div>
      <div class="box box3">Box 3</div>
      <div class="box box4">Box 4</div>
    </main>
  </div>
</body>
</html>
