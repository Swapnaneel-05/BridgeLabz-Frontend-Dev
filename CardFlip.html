<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <style>body, html {
  height: 100%;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f4f4f4;
  perspective: 1000px;
}

.card {
  width: 300px;
  height: 200px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s ease;
}

.card:hover {
  transform: rotateY(180deg);
}

.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 10px;
  overflow: hidden;
}

.front {
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.front img {
  width: 100%;
  height: 70%;
  object-fit: cover;
}

.back {
  background: #333;
  color: white;
  transform: rotateY(180deg);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  text-align: center;
}</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="front">
        <img src="https://picsum.photos/400/200" alt="Card Image">
        <h2>Card Title</h2>
      </div>
      <div class="back">
        <p>This is the back side of the card. It contains additional details.</p>
      </div>
    </div>
  </div>
</body>
</html>
