<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agency Showcase</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    .carousel-caption {
      background: rgba(0,0,0,0.4);
      padding: 10px 20px;
      border-radius: 8px;
    }

    footer {
      background: #0d6efd;
      color: white;
      padding: 20px 0;
      margin-top: 40px;
      text-align: center;
    }

    .carousel-img {
      height: 450px;
      object-fit: cover;
    }
  </style>

</head>

<body class="bg-light">

  <div class="container py-4">

    <h1 class="text-center fw-bold mb-4">Explore The World</h1>

    <!-- CAROUSEL -->
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">

      <div class="carousel-inner">

        <!-- Slide 1 -->
        <div class="carousel-item active" data-bs-interval="3000">
          <img src="https://picsum.photos/id/1018/1000/450" class="d-block w-100 carousel-img" alt="">
          <div class="carousel-caption">
            <h3>Paris, France</h3>
            <p>The City of Lights awaits you.</p>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-item" data-bs-interval="4000">
          <img src="https://picsum.photos/id/1015/1000/450" class="d-block w-100 carousel-img" alt="">
          <div class="carousel-caption">
            <h3>Tokyo, Japan</h3>
            <p>Where tradition meets technology.</p>
          </div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-item" data-bs-interval="5000">
          <img src="https://picsum.photos/id/1022/1000/450" class="d-block w-100 carousel-img" alt="">
          <div class="carousel-caption">
            <h3>Bali, Indonesia</h3>
            <p>Your perfect tropical escape.</p>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>

    <!-- PROGRESS BAR -->
    <div class="mt-5">
      <h4 class="fw-bold mb-2">Booking Completion</h4>
      <div class="progress">
        <div 
          class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
          role="progressbar"
          style="width: 70%;">
          70%
        </div>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <p>Contact Us: travelworld@example.com | +91 98765 43210</p>
    <p>© 2025 Travel World Agency</p>
  </footer>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
