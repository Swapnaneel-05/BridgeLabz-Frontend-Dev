<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio - Bootstrap Basics</title>

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light text-dark">

  <!-- HEADER -->
  <header class="text-center p-5">
    <h1 class="fw-bold">Swapnaneel Bhadra</h1>
    <p class="mt-3 fs-5">Aspiring Developer • Learner • Creator</p>
  </header>

  <!-- PROFILE SECTION -->
  <div class="container text-center">

    <img 
      src="https://i.pravatar.cc/250" 
      alt="Profile Photo"
      class="img-fluid rounded-circle mb-3"
      style="width: 200px; height: 200px; object-fit: cover;"
    >

    <p class="mb-4 fs-6">
      Passionate about Frontend Development, UI/UX, and building modern web experiences.
    </p>

    <!-- BUTTONS -->
    <div class="mb-5">
      <a href="#" class="btn btn-primary btn-lg me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-dark btn-lg">Download CV</a>
    </div>

    <!-- CONTACT FORM -->
    <div class="bg-white p-4 shadow-sm rounded mb-5" style="max-width: 500px; margin: auto;">
      <h4 class="fw-bold mb-3">Contact Me</h4>

      <form>
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Email Address">
        <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
        <button class="btn btn-success w-100">Send Message</button>
      </form>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
