<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Landing Page</title>

  <!-- Bootstrap CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <style>
    .hero {
      padding: 100px 20px;
      background: linear-gradient(135deg, #0d6efd, #4fa3ff);
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
    }

    .hero p {
      margin-top: 10px;
      font-size: 1.25rem;
      opacity: 0.9;
    }

    .hero .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">TechStartup</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navmenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="container">
      <div class="row justify-content-center">

        <div class="col-md-10 col-lg-8">
          <h1>Build the Future with Us</h1>
          <p>Your success starts with a powerful digital presence. Let our tools guide your growth.</p>

          <a href="#" class="btn btn-light btn-lg text-primary fw-bold">
            Get Started
          </a>
        </div>

      </div>
    </div>
  </section>

  <!-- Bootstrap JS (for navbar toggle) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
